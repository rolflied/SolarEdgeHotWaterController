name: Release

on:
  push:
    tags:
      - "v*"
  # Manual start: tags the current master with the manifest version
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        run: |
          manifest=$(jq -r .version custom_components/solaredge_hwc/manifest.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "v${manifest}" != "${tag}" ]; then
              echo "Tag ${tag} does not match manifest version ${manifest}"
              exit 1
            fi
          else
            if [ "${GITHUB_REF_NAME}" != "master" ]; then
              echo "Manual releases are only made from master"
              exit 1
            fi
            tag="v${manifest}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "Tag ${tag} already exists"
              exit 1
            fi
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          awk -v tag="${TAG}" '
            $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
